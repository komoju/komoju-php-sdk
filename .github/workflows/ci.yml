name: Validate

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  validate:
    runs-on: [self-hosted, beta, public-release]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.1, 2026-05-14
        with:
          php-version: '8.2'
          tools: composer:2.9.8
      - run: composer validate --strict
      - run: find lib -name "*.php" -print0 | xargs -0 -n1 php -l
