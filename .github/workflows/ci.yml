name: Validate

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2.40.0, 2026-10-08
        with:
          php-version: '8.2'
          tools: composer:2.9.8
      - run: composer validate --strict
      - run: find lib -name "*.php" -print0 | xargs -0 -n1 php -l
