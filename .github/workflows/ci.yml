name: Validate

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2.37.1, 2026-05-14
        with:
          php-version: '8.2'
          tools: composer:v2
      - run: composer validate --strict
      - run: find lib -name "*.php" -print0 | xargs -0 -n1 php -l
