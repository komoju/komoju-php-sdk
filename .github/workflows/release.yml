name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  validate:
    runs-on: [self-hosted, beta, public-release]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2.40.0, 2026-10-08
        with:
          php-version: '8.2'
          tools: composer:2.9.8
      - run: composer validate --strict
      - run: find lib -name "*.php" -print0 | xargs -0 -n1 php -l

  release:
    needs: validate
    runs-on: [self-hosted, beta, public-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PRERELEASE=""
          if [[ "$TAG_NAME" == *"beta"* ]] || [[ "$TAG_NAME" == *"alpha"* ]] || [[ "$TAG_NAME" == *"rc"* ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$TAG_NAME" --generate-notes $PRERELEASE
